version: '3.8'

services:
  api-gateway:
    build:
      context: ..
      dockerfile: docker/api-gateway.Dockerfile
    container_name: smartretailx-gateway
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ReverseProxy__Clusters__user-cluster__Destinations__destination1__Address=http://user-service:8080
      - ReverseProxy__Clusters__product-cluster__Destinations__destination1__Address=http://product-service:8080
      - ReverseProxy__Clusters__order-cluster__Destinations__destination1__Address=http://order-service:8080
      - ReverseProxy__Clusters__inventory-cluster__Destinations__destination1__Address=http://inventory-service:8080
      - ReverseProxy__Clusters__payment-cluster__Destinations__destination1__Address=http://payment-service:8080
      - ReverseProxy__Clusters__notification-cluster__Destinations__destination1__Address=http://notification-service:8080
    depends_on:
      - user-service
      - product-service
      - order-service
      - inventory-service
      - payment-service
      - notification-service
    networks:
      - smartretailx-net

  user-service:
    build:
      context: ..
      dockerfile: docker/user-service.Dockerfile
    container_name: smartretailx-user
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/users.db
    volumes:
      - user-data:/app/data
    networks:
      - smartretailx-net

  product-service:
    build:
      context: ..
      dockerfile: docker/product-service.Dockerfile
    container_name: smartretailx-product
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/products.db
    volumes:
      - product-data:/app/data
    networks:
      - smartretailx-net

  order-service:
    build:
      context: ..
      dockerfile: docker/order-service.Dockerfile
    container_name: smartretailx-order
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/orders.db
    volumes:
      - order-data:/app/data
    networks:
      - smartretailx-net

  inventory-service:
    build:
      context: ..
      dockerfile: docker/inventory-service.Dockerfile
    container_name: smartretailx-inventory
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/inventory.db
    volumes:
      - inventory-data:/app/data
    networks:
      - smartretailx-net

  payment-service:
    build:
      context: ..
      dockerfile: docker/payment-service.Dockerfile
    container_name: smartretailx-payment
    ports:
      - "5005:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - smartretailx-net

  notification-service:
    build:
      context: ..
      dockerfile: docker/notification-service.Dockerfile
    container_name: smartretailx-notification
    ports:
      - "5006:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - smartretailx-net

volumes:
  user-data:
  product-data:
  order-data:
  inventory-data:

networks:
  smartretailx-net:
    driver: bridge
