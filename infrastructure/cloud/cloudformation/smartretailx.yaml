AWSTemplateFormatVersion: '2010-09-09'

Description: >
  SmartRetailX - CloudFormation infrastructure for the remaining
  application deployment. Existing VPC, subnets, ECR repositories,
  CloudWatch log groups and ECS cluster are reused.

# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  # ----------------------------------------------------------
  # EXISTING NETWORK
  # ----------------------------------------------------------

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing SmartRetailX VPC

  PublicSubnetA:
    Type: AWS::EC2::Subnet::Id
    Description: Existing SmartRetailX public subnet A

  PublicSubnetB:
    Type: AWS::EC2::Subnet::Id
    Description: Existing SmartRetailX public subnet B

  PrivateSubnetA:
    Type: AWS::EC2::Subnet::Id
    Description: Existing SmartRetailX private subnet A

  PrivateSubnetB:
    Type: AWS::EC2::Subnet::Id
    Description: Existing SmartRetailX private subnet B


  # ----------------------------------------------------------
  # EXISTING ECS CLUSTER
  # ----------------------------------------------------------

  ECSClusterName:
    Type: String
    Default: SmartRetailX-Cluster
    Description: Existing SmartRetailX ECS cluster


  # ----------------------------------------------------------
  # CONTAINER IMAGES
  # ----------------------------------------------------------

  UserImage:
    Type: String
    Description: Full ECR image URI for UserService

  ProductImage:
    Type: String
    Description: Full ECR image URI for ProductService

  OrderImage:
    Type: String
    Description: Full ECR image URI for OrderService

  InventoryImage:
    Type: String
    Description: Full ECR image URI for InventoryService

  NotificationImage:
    Type: String
    Description: Full ECR image URI for NotificationService


  # ----------------------------------------------------------
  # CONTAINER PORT
  # ----------------------------------------------------------

  ContainerPort:
    Type: Number
    Default: 8080
    Description: Port used by the Docker containers


# ============================================================
# RESOURCES
# ============================================================

Resources:


  # ==========================================================
  # 1. APPLICATION LOAD BALANCER SECURITY GROUP
  # ==========================================================

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:

      GroupDescription:
        SmartRetailX Application Load Balancer Security Group

      VpcId:
        !Ref VpcId

      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

      SecurityGroupEgress:

        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:

        - Key: Name
          Value: SmartRetailX-ALB-SG


  # ==========================================================
  # 2. ECS SECURITY GROUP
  # ==========================================================

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:

      GroupDescription:
        SmartRetailX ECS Application Security Group

      VpcId:
        !Ref VpcId

      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId:
            !Ref ALBSecurityGroup

      SecurityGroupEgress:

        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:

        - Key: Name
          Value: SmartRetailX-ECS-SG


  # ==========================================================
  # 3. ECS EXECUTION ROLE
  # ==========================================================

  ECSExecutionRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName: SmartRetailX-ECS-ExecutionRole

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - ecs-tasks.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy


  # ==========================================================
  # 4. ECS APPLICATION TASK ROLE
  # ==========================================================

  ECSTaskRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName: SmartRetailX-ECS-TaskRole

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - ecs-tasks.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: SmartRetailX-ApplicationAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource: "*"


  # ==========================================================
  # 5. APPLICATION LOAD BALANCER
  # ==========================================================

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer

    Properties:

      Name: SmartRetailX-ALB

      Scheme: internet-facing

      Type: application

      SecurityGroups:

        - !Ref ALBSecurityGroup

      Subnets:

        - !Ref PublicSubnetA
        - !Ref PublicSubnetB

      Tags:

        - Key: Name
          Value: SmartRetailX-ALB


  # ==========================================================
  # 6. USER TARGET GROUP
  # ==========================================================

  UserTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup

    Properties:

      Name: SmartRetailX-User-TG

      VpcId:
        !Ref VpcId

      Port:
        !Ref ContainerPort

      Protocol: HTTP

      TargetType: ip

      HealthCheckEnabled: true

      HealthCheckPath: /

      HealthCheckProtocol: HTTP

      HealthCheckPort: traffic-port

      HealthyThresholdCount: 2

      UnhealthyThresholdCount: 3

      HealthCheckIntervalSeconds: 30

      HealthCheckTimeoutSeconds: 5


  # ==========================================================
  # 7. PRODUCT TARGET GROUP
  # ==========================================================

  ProductTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup

    Properties:

      Name: SmartRetailX-Product-TG

      VpcId:
        !Ref VpcId

      Port:
        !Ref ContainerPort

      Protocol: HTTP

      TargetType: ip

      HealthCheckEnabled: true

      HealthCheckPath: /

      HealthCheckProtocol: HTTP


  # ==========================================================
  # 8. ORDER TARGET GROUP
  # ==========================================================

  OrderTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup

    Properties:

      Name: SmartRetailX-Order-TG

      VpcId:
        !Ref VpcId

      Port:
        !Ref ContainerPort

      Protocol: HTTP

      TargetType: ip

      HealthCheckEnabled: true

      HealthCheckPath: /

      HealthCheckProtocol: HTTP


  # ==========================================================
  # 9. ALB LISTENER
  # ==========================================================

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener

    Properties:

      LoadBalancerArn:
        !Ref ApplicationLoadBalancer

      Port: 80

      Protocol: HTTP

      DefaultActions:

        - Type: forward

          TargetGroupArn:
            !Ref UserTargetGroup


  # ==========================================================
  # 10. USER TASK DEFINITION
  # ==========================================================

  UserTaskDefinition:
    Type: AWS::ECS::TaskDefinition

    Properties:

      Family: SmartRetailX-UserTask

      NetworkMode: awsvpc

      RequiresCompatibilities:

        - FARGATE

      Cpu: '512'

      Memory: '1024'

      ExecutionRoleArn:
        !GetAtt ECSExecutionRole.Arn

      TaskRoleArn:
        !GetAtt ECSTaskRole.Arn

      ContainerDefinitions:

        - Name: user-service

          Image:
            !Ref UserImage

          Essential: true

          PortMappings:

            - ContainerPort:
                !Ref ContainerPort

              Protocol: tcp

          LogConfiguration:

            LogDriver: awslogs

            Options:

              awslogs-group: /ecs/SmartRetailX-UserTask

              awslogs-region:
                !Ref AWS::Region

              awslogs-stream-prefix: user


  # ==========================================================
  # 11. PRODUCT TASK DEFINITION
  # ==========================================================

  ProductTaskDefinition:
    Type: AWS::ECS::TaskDefinition

    Properties:

      Family: SmartRetailX-ProductTask

      NetworkMode: awsvpc

      RequiresCompatibilities:

        - FARGATE

      Cpu: '512'

      Memory: '1024'

      ExecutionRoleArn:
        !GetAtt ECSExecutionRole.Arn

      TaskRoleArn:
        !GetAtt ECSTaskRole.Arn

      ContainerDefinitions:

        - Name: product-service

          Image:
            !Ref ProductImage

          Essential: true

          PortMappings:

            - ContainerPort:
                !Ref ContainerPort

              Protocol: tcp

          LogConfiguration:

            LogDriver: awslogs

            Options:

              awslogs-group: /ecs/SmartRetailX-ProductTask

              awslogs-region:
                !Ref AWS::Region

              awslogs-stream-prefix: product


  # ==========================================================
  # 12. ORDER TASK DEFINITION
  # ==========================================================

  OrderTaskDefinition:
    Type: AWS::ECS::TaskDefinition

    Properties:

      Family: SmartRetailX-OrderTask

      NetworkMode: awsvpc

      RequiresCompatibilities:

        - FARGATE

      Cpu: '512'

      Memory: '1024'

      ExecutionRoleArn:
        !GetAtt ECSExecutionRole.Arn

      TaskRoleArn:
        !GetAtt ECSTaskRole.Arn

      ContainerDefinitions:

        - Name: order-service

          Image:
            !Ref OrderImage

          Essential: true

          PortMappings:

            - ContainerPort:
                !Ref ContainerPort

              Protocol: tcp

          LogConfiguration:

            LogDriver: awslogs

            Options:

              awslogs-group: /ecs/SmartRetailX-OrderTask

              awslogs-region:
                !Ref AWS::Region

              awslogs-stream-prefix: order


  # ==========================================================
  # 13. USER ECS SERVICE
  # ==========================================================

  UserService:
    Type: AWS::ECS::Service

    DependsOn:

      - ALBListener

    Properties:

      ServiceName:
        SmartRetailX-UserService

      Cluster:
        !Ref ECSClusterName

      LaunchType:
        FARGATE

      DesiredCount: 1

      TaskDefinition:
        !Ref UserTaskDefinition

      NetworkConfiguration:

        AwsvpcConfiguration:

          AssignPublicIp:
            DISABLED

          SecurityGroups:

            - !Ref ECSSecurityGroup

          Subnets:

            - !Ref PrivateSubnetA
            - !Ref PrivateSubnetB

      LoadBalancers:

        - ContainerName:
            user-service

          ContainerPort:
            !Ref ContainerPort

          TargetGroupArn:
            !Ref UserTargetGroup


  # ==========================================================
  # 14. PRODUCT ECS SERVICE
  # ==========================================================

  ProductService:
    Type: AWS::ECS::Service

    Properties:

      ServiceName:
        SmartRetailX-ProductService

      Cluster:
        !Ref ECSClusterName

      LaunchType:
        FARGATE

      DesiredCount: 1

      TaskDefinition:
        !Ref ProductTaskDefinition

      NetworkConfiguration:

        AwsvpcConfiguration:

          AssignPublicIp:
            DISABLED

          SecurityGroups:

            - !Ref ECSSecurityGroup

          Subnets:

            - !Ref PrivateSubnetA
            - !Ref PrivateSubnetB

      LoadBalancers:

        - ContainerName:
            product-service

          ContainerPort:
            !Ref ContainerPort

          TargetGroupArn:
            !Ref ProductTargetGroup


  # ==========================================================
  # 15. ORDER ECS SERVICE
  # ==========================================================

  OrderService:
    Type: AWS::ECS::Service

    Properties:

      ServiceName:
        SmartRetailX-OrderService

      Cluster:
        !Ref ECSClusterName

      LaunchType:
        FARGATE

      DesiredCount: 1

      TaskDefinition:
        !Ref OrderTaskDefinition

      NetworkConfiguration:

        AwsvpcConfiguration:

          AssignPublicIp:
            DISABLED

          SecurityGroups:

            - !Ref ECSSecurityGroup

          Subnets:

            - !Ref PrivateSubnetA
            - !Ref PrivateSubnetB

      LoadBalancers:

        - ContainerName:
            order-service

          ContainerPort:
            !Ref ContainerPort

          TargetGroupArn:
            !Ref OrderTargetGroup


  # ==========================================================
  # 16. EVENTBRIDGE EVENT BUS
  # ==========================================================

  SmartRetailXEventBus:
    Type: AWS::Events::EventBus

    Properties:

      Name: SmartRetailX-EventBus


  # ==========================================================
  # 17. IAM ROLE FOR EVENTBRIDGE -> INVENTORY
  # ==========================================================

  EventBridgeInventoryRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName: SmartRetailX-EventBridge-InventoryRole

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - events.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: InvokeInventoryService

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - ecs:RunTask

                Resource: "*"


  # ==========================================================
  # 18. IAM ROLE FOR EVENTBRIDGE -> NOTIFICATION
  # ==========================================================

  EventBridgeNotificationRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName: SmartRetailX-EventBridge-NotificationRole

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - events.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: InvokeNotificationService

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - ecs:RunTask

                Resource: "*"


  # ==========================================================
  # 19. EVENTBRIDGE ORDER CREATED RULE
  # ==========================================================

  OrderCreatedRule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        SmartRetailX-OrderCreated

      Description:
        Routes OrderCreated events to downstream services

      EventBusName:
        !Ref SmartRetailXEventBus

      State:
        ENABLED

      EventPattern:

        source:

          - SmartRetailX.OrderService

        detail-type:

          - OrderCreated

      Targets:

        # ----------------------------------------------------
        # INVENTORY TARGET
        # ----------------------------------------------------

        - Id:
            InventoryTarget

          Arn:
            !GetAtt InventoryQueue.Arn


        # ----------------------------------------------------
        # NOTIFICATION TARGET
        # ----------------------------------------------------

        - Id:
            NotificationTarget

          Arn:
            !GetAtt NotificationQueue.Arn


  # ==========================================================
  # 20. INVENTORY SQS QUEUE
  # ==========================================================

  InventoryQueue:
    Type: AWS::SQS::Queue

    Properties:

      QueueName:
        SmartRetailX-InventoryQueue

      VisibilityTimeout:
        60

      MessageRetentionPeriod:
        345600


  # ==========================================================
  # 21. NOTIFICATION SQS QUEUE
  # ==========================================================

  NotificationQueue:
    Type: AWS::SQS::Queue

    Properties:

      QueueName:
        SmartRetailX-NotificationQueue

      VisibilityTimeout:
        60

      MessageRetentionPeriod:
        345600


  # ==========================================================
  # 22. EVENTBRIDGE -> INVENTORY QUEUE POLICY
  # ==========================================================

  InventoryQueuePolicy:
    Type: AWS::SQS::QueuePolicy

    Properties:

      Queues:

        - !Ref InventoryQueue

      PolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Sid:
              AllowEventBridgeToSend

            Effect: Allow

            Principal:

              Service:
                events.amazonaws.com

            Action:
              - sqs:SendMessage

            Resource:
              !GetAtt InventoryQueue.Arn

            Condition:

              ArnEquals:

                aws:SourceArn:
                  !GetAtt OrderCreatedRule.Arn


  # ==========================================================
  # 23. EVENTBRIDGE -> NOTIFICATION QUEUE POLICY
  # ==========================================================

  NotificationQueuePolicy:
    Type: AWS::SQS::QueuePolicy

    Properties:

      Queues:

        - !Ref NotificationQueue

      PolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Sid:
              AllowEventBridgeToSend

            Effect: Allow

            Principal:

              Service:
                events.amazonaws.com

            Action:
              - sqs:SendMessage

            Resource:
              !GetAtt NotificationQueue.Arn

            Condition:

              ArnEquals:

                aws:SourceArn:
                  !GetAtt OrderCreatedRule.Arn


  # ==========================================================
  # 24. DEAD LETTER QUEUE - INVENTORY
  # ==========================================================

  InventoryDLQ:
    Type: AWS::SQS::Queue

    Properties:

      QueueName:
        SmartRetailX-InventoryDLQ


  # ==========================================================
  # 25. DEAD LETTER QUEUE - NOTIFICATION
  # ==========================================================

  NotificationDLQ:
    Type: AWS::SQS::Queue

    Properties:

      QueueName:
        SmartRetailX-NotificationDLQ


# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  VPC:
    Description:
      Existing SmartRetailX VPC

    Value:
      !Ref VpcId


  ECSCluster:
    Description:
      Existing SmartRetailX ECS Cluster

    Value:
      !Ref ECSClusterName


  LoadBalancerDNS:
    Description:
      SmartRetailX Application Load Balancer DNS

    Value:
      !GetAtt ApplicationLoadBalancer.DNSName


  ALBSecurityGroup:
    Description:
      Application Load Balancer Security Group

    Value:
      !Ref ALBSecurityGroup


  ECSSecurityGroup:
    Description:
      ECS Security Group

    Value:
      !Ref ECSSecurityGroup


  UserService:
    Description:
      User ECS Service

    Value:
      !Ref UserService


  ProductService:
    Description:
      Product ECS Service

    Value:
      !Ref ProductService


  OrderService:
    Description:
      Order ECS Service

    Value:
      !Ref OrderService


  EventBus:
    Description:
      SmartRetailX EventBridge Event Bus

    Value:
      !Ref SmartRetailXEventBus


  OrderCreatedRule:
    Description:
      EventBridge OrderCreated Rule

    Value:
      !Ref OrderCreatedRule


  InventoryQueue:
    Description:
      Inventory SQS Queue

    Value:
      !GetAtt InventoryQueue.QueueUrl


  NotificationQueue:
    Description:
      Notification SQS Queue

    Value:
      !GetAtt NotificationQueue.QueueUrl